<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ผู้ช่วยสคริปต์ Roblox</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600&family=JetBrains+Mono&display=swap">
<style>
:root{--bg:#eef1f6;--ink:#1b2433;--mute:#5d6a82;--line:#d4dbe8;--accent:#2f5bff;--user:#dce4ff;--code:#161d2b;--codeink:#e6ebf5}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans Thai",system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:max(14px,env(safe-area-inset-top)) 20px 12px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}
header button{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
main{flex:1;overflow-y:auto;padding:20px}
#log{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.msg{white-space:pre-wrap;overflow-wrap:anywhere}
.user{align-self:flex-end;background:var(--user);padding:10px 14px;border-radius:16px 16px 4px 16px;max-width:85%}
.hint{color:var(--mute)}
.code{border-radius:10px;overflow:hidden;background:var(--code);margin:10px 0;white-space:normal}
.bar{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;border-bottom:1px solid #2a3448;color:#8d9ab5;font:13px "JetBrains Mono",monospace}
.bar button{background:none;border:0;color:#8fb0ff;font:inherit;cursor:pointer}
pre{margin:0;padding:14px;overflow-x:auto;color:var(--codeink);font:14px/1.6 "JetBrains Mono",monospace;white-space:pre}
footer{padding:12px 20px max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
form{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;resize:none;max-height:160px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:#fff;color:var(--ink)}
#send{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}
#send:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header><h1>ผู้ช่วยสคริปต์ Roblox</h1><button id="clear" type="button">เริ่มแชทใหม่</button></header>
<main id="main"><div id="log"><p class="hint">ถามเรื่องสคริปต์ Roblox หรืออะไรก็ได้ เช่น "เขียนสคริปต์เซฟเงินผู้เล่นด้วย DataStore"</p></div></main>
<footer>
  <form id="form">
    <textarea id="q" rows="1" placeholder="พิมพ์คำถาม (Ctrl+Enter เพื่อส่ง)"></textarea>
    <button id="send" type="submit">ส่ง</button>
  </form>
</footer>
<script>
const log = document.getElementById('log'), main = document.getElementById('main');
const box = document.getElementById('q'), sendBtn = document.getElementById('send');
let history = [], busy = false, code = localStorage.getItem('code') || '';

function add(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  log.append(d);
  main.scrollTop = main.scrollHeight;
  return d;
}

// แปลงข้อความเป็นข้อความธรรมดา + บล็อกโค้ด (ใช้ textContent ทั้งหมด ปลอดภัยจาก HTML injection)
function render(el, text) {
  el.textContent = '';
  text.split('```').forEach((part, i) => {
    if (i % 2 === 0) {
      if (part) el.append(document.createTextNode(part));
      return;
    }
    const nl = part.indexOf('\n');
    const lang = (nl < 0 ? part : part.slice(0, nl)).trim() || 'code';
    const body = nl < 0 ? '' : part.slice(nl + 1).replace(/\n$/, '');
    const wrap = document.createElement('div'); wrap.className = 'code';
    const bar = document.createElement('div'); bar.className = 'bar';
    const l = document.createElement('span'); l.textContent = lang;
    const b = document.createElement('button'); b.type = 'button'; b.textContent = 'คัดลอก';
    b.onclick = () => { navigator.clipboard.writeText(body); b.textContent = 'คัดลอกแล้ว'; setTimeout(() => b.textContent = 'คัดลอก', 1500); };
    bar.append(l, b);
    const pre = document.createElement('pre'); pre.textContent = body;
    wrap.append(bar, pre);
    el.append(wrap);
  });
  main.scrollTop = main.scrollHeight;
}

async function ask() {
  const text = box.value.trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true; box.value = '';
  history.push({ role: 'user', content: text });
  add('user', text);
  const bot = add('bot', '…');
  let full = '';
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-code': code },
      body: JSON.stringify({ messages: history })
    });
    if (r.status === 401) {
      code = prompt('ใส่รหัสเข้าใช้งาน') || '';
      localStorage.setItem('code', code);
      bot.textContent = 'ต้องใช้รหัสเข้าใช้งาน กรุณาส่งข้อความอีกครั้ง';
      history.pop();
      return;
    }
    if (!r.ok) throw new Error(await r.text());
    const rd = r.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await rd.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const ln of lines) {
        if (!ln.startsWith('data: ') || ln.includes('[DONE]')) continue;
        try { full += JSON.parse(ln.slice(6)).choices[0].delta.content || ''; render(bot, full); } catch {}
      }
    }
    history.push({ role: 'assistant', content: full });
  } catch (e) {
    bot.textContent = 'เกิดข้อผิดพลาด: ' + e.message;
    history.pop();
  } finally {
    busy = false; sendBtn.disabled = false; box.focus();
  }
}

document.getElementById('form').addEventListener('submit', e => { e.preventDefault(); ask(); });
box.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); ask(); } });
box.addEventListener('input', () => { box.style.height = 'auto'; box.style.height = box.scrollHeight + 'px'; });
document.getElementById('clear').onclick = () => { history = []; log.querySelectorAll('.msg').forEach(m => m.remove()); };
</script>
</body>
</html>
